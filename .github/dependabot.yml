version: 2
updates:
- package-ecosystem: "npm"
  directories:
  - "/ts"
  open-pull-requests-limit: 5
  schedule:
    interval: "monthly"
  groups:
    npm:
      patterns:
        - "*"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  groups:
    actions:
      patterns:
        - "*"
- package-ecosystem: "gomod"
  directory: "/"
  open-pull-requests-limit: 10
  schedule:
    interval: "weekly"
  groups:
    gomod:
      patterns:
        - "*"
- package-ecosystem: "maven"
  directory: "/java"
  open-pull-requests-limit: 10
  schedule:
    interval: "weekly"
  groups:
    maven:
      patterns:
        - "*"
